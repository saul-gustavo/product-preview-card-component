<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- styles -->
  <link rel="stylesheet" href="styles.css">
  <!-- favicon -->
  <link rel="shortcut icon" href="imagenes/favicon-32x32.png" type="image/x-icon">
  <title>Frontend Mentor | Product preview card component</title>
</head>

<body>
  <main class="main" role="main">

    <figure class="imagen">

      <img src="imagenes/image-product-desktop.jpg" alt="image-product-desktop" class="img-perfume">

    </figure>

    <div class="card" role="contentinfo">
      <section class="contenido">
        <p class="title">P E R F U M E</p>
        <h1 class="sub-title">Gabrielle Essence Eau De Parfum</h1>
        <p class="text"> A floral, solar and voluptuous interpretation composed by Olivier Polge,
          Perfumer-Creator for the House of CHANEL.
        </p>
      </section>
      <div class="values" role="complementary">
        <p class="new">$149.99 <del class="old">$169.99</del></p>
      </div>
      <button type="submit" class="boton">
        <img src="imagenes/icon-cart.svg" alt="icon-cart" class="icono">
        Add to Cart
      </button>
    </div>
  </main>

  <div class="attribution" role="doc-credits">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="https://github.com/Saul-Gustavo" target="_blank">Saul Gustavo Alcantar Sanchez</a>.
  </div>

</body>

</html>
